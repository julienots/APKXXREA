<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#26221a"/>
      <stop offset="0.55" stop-color="#0e0d0b"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="0.55" stop-color="#FFC928"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFC928"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#000" flood-opacity="0.85"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#FFC928" stroke-opacity="0.18" stroke-width="3"/>
  <g transform="translate(0 -6)">
  <!-- gauge -->
  <path d="M 120 372 A 170 170 0 1 1 392 372" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="22" stroke-linecap="round"/>
  <path d="M 120 372 A 170 170 0 1 1 392 372" fill="none" stroke="url(#arc)" stroke-width="10" stroke-linecap="round" stroke-dasharray="4 14"/>
  <circle cx="392" cy="372" r="11" fill="#FFC928" filter="url(#glow)"/>
  <!-- M made of equalizer bars -->
  <g filter="url(#shadow)">
    <g fill="url(#gold)" filter="url(#glow)">
      <rect x="136" y="160" width="40" height="200" rx="20"/>
      <rect x="192" y="208" width="40" height="120" rx="20"/>
      <rect x="248" y="256" width="40" height="82" rx="20" transform="translate(-12 0)"/>
      <rect x="292" y="208" width="40" height="120" rx="20" transform="translate(-16 0)"/>
      <rect x="336" y="160" width="40" height="200" rx="20"/>
    </g>
  </g>
  <rect x="136" y="384" width="240" height="10" rx="5" fill="#ffffff" fill-opacity="0.9"/>
  </g>
</svg>
