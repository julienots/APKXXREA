<!doctype html><html><head><style>
@font-face{font-family:F;src:url(../../web/public/fonts/fredoka-latin-700-normal.woff2)}
html,body{margin:0;background:transparent}
#i{width:512px;height:512px;border-radius:112px;background:radial-gradient(circle at 50% 30%,#1d1d24,#000 75%);display:grid;place-items:center;position:relative;overflow:hidden}
.t{font:700 270px/1 F;letter-spacing:-6px;text-shadow:10px 12px 0 #2a2a33;margin-top:-10px}
.t b{color:#fff;font-weight:700}.t span{color:#ffcd20}
.dot{position:absolute;width:44px;height:44px;border-radius:50%;background:#ffcd20;right:44px;bottom:162px;box-shadow:10px 12px 0 #2a2a33}
.ring{position:absolute;inset:34px;border-radius:90px;border:10px solid rgba(255,205,32,.18)}
</style></head><body><div id="i"><div class="ring"></div><div class="t"><b>S</b><span>E</span></div><div class="dot"></div></div></body></html>
