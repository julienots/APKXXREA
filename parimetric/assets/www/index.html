<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Parimetric</title>
<style>
:root{
  --bg:#0B0D12;--s1:#12151D;--s2:#181C27;--s3:#202536;--line:#262C3D;--line2:#31384C;
  --tx:#EDF0F6;--mu:#8C95A8;--mu2:#5E667A;
  --red:#E3182D;--red2:#B8101F;--redbg:rgba(227,24,45,.12);
  --grn:#1FC27A;--grnbg:rgba(31,194,122,.12);--amb:#F2A93B;--ambbg:rgba(242,169,59,.12);--blu:#4C8DFF;
  --r:12px;--nav:62px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,"Roboto","Segoe UI",system-ui,sans-serif;height:100%;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
input,select{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--red)}
.num{font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand b{font-weight:800;letter-spacing:.14em;font-size:15px}
.brand b span{color:var(--red)}
.chip-bank{display:flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--line);border-radius:20px;padding:6px 11px;font-weight:700;font-size:13px}
.chip-bank i{width:7px;height:7px;border-radius:50%;background:var(--grn);display:block}
.ibtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line)}
.ibtn svg{width:18px;height:18px}
.sports{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);scrollbar-width:none;flex-shrink:0}
.sports::-webkit-scrollbar,.hs::-webkit-scrollbar{display:none}
.sp{flex-shrink:0;padding:7px 13px;border-radius:18px;background:var(--s1);border:1px solid var(--line);color:var(--mu);font-weight:600;font-size:12.5px;white-space:nowrap}
.sp.on{background:var(--red);border-color:var(--red);color:#fff}
main{flex:1;overflow-y:auto;padding:14px 16px calc(var(--nav) + 90px);-webkit-overflow-scrolling:touch}
nav{position:fixed;left:0;right:0;bottom:0;height:var(--nav);background:var(--s1);border-top:1px solid var(--line);display:flex;z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mu2);font-size:10.5px;font-weight:600;letter-spacing:.02em}
nav button svg{width:21px;height:21px}
nav button.on{color:var(--tx)}
nav button.on svg{color:var(--red)}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:700;margin:20px 0 10px;display:flex;align-items:center;justify-content:space-between}
h2:first-child{margin-top:4px}
h2 small{letter-spacing:0;text-transform:none;font-weight:500;color:var(--mu2)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card{margin-top:10px}
.banner{border-radius:var(--r);padding:12px 14px;font-size:12.5px;display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;background:var(--ambbg);color:#F6C77A;border:1px solid rgba(242,169,59,.25)}
.banner.ok{background:var(--grnbg);color:#7FE0B2;border-color:rgba(31,194,122,.25)}
.banner svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px}
.kpi span{display:block;color:var(--mu);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.kpi b{display:block;font-size:19px;font-weight:800;margin-top:3px}
.ev{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px;margin-bottom:10px}
.ev-top{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:11.5px;margin-bottom:8px;gap:8px}
.ev-top .lg{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-teams{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.ev-teams div{font-weight:700;font-size:14.5px;line-height:1.35}
.more{color:var(--mu);font-size:12px;font-weight:600;display:flex;align-items:center;gap:2px;white-space:nowrap}
.odds{display:grid;gap:6px}
.o{background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;min-width:0}
.o small{color:var(--mu);font-size:10.5px;font-weight:600}
.o b{font-size:15px;font-weight:800}
.o em{font-style:normal;font-size:10px;color:var(--mu2);font-weight:600}
.o.sel{background:var(--red);border-color:var(--red)}
.o.sel small,.o.sel em{color:rgba(255,255,255,.8)}
.o.val::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--grn)}
.tag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.02em;white-space:nowrap}
.tag.g{background:var(--grnbg);color:var(--grn)}.tag.r{background:var(--redbg);color:#FF5A6A}.tag.a{background:var(--ambbg);color:var(--amb)}.tag.n{background:var(--s3);color:var(--mu)}
.row{display:flex;align-items:center;gap:10px}
.sp-b{justify-content:space-between}
.muted{color:var(--mu)}.mu2{color:var(--mu2)}
.pick{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.pick:last-child{border-bottom:0;padding-bottom:2px}.pick:first-child{padding-top:2px}
.pick .m{flex:1;min-width:0}
.pick .m b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .m span{display:block;color:var(--mu);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .od{text-align:right}
.pick .od b{font-size:15px;font-weight:800;display:block}
.bar{height:5px;background:var(--s3);border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--red);border-radius:4px}
.bar.g i{background:var(--grn)}
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--mu)}
.seg button.on{background:var(--s3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:11px;background:var(--red);color:#fff;font-weight:800;letter-spacing:.03em;font-size:14px}
.btn:active{background:var(--red2)}
.btn.sec{background:var(--s2);border:1px solid var(--line2);color:var(--tx)}
.btn.sm{width:auto;padding:8px 12px;font-size:12.5px;border-radius:9px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;color:var(--mu);font-weight:600;margin-bottom:6px;letter-spacing:.03em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.combo{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.combo-h{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--s2);border-bottom:1px solid var(--line)}
.combo-h .rk{font-weight:800;font-size:12px;color:var(--mu);letter-spacing:.08em}
.combo-b{padding:4px 14px}
.combo-f{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.combo-f div{padding:9px 6px;text-align:center;border-right:1px solid var(--line)}
.combo-f div:last-child{border-right:0}
.combo-f span{display:block;font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.combo-f b{font-size:14px;font-weight:800}
.slip{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + 10px);background:var(--red);border-radius:13px;padding:11px 14px;display:none;align-items:center;gap:12px;z-index:19;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.slip.show{display:flex}
.slip .cnt{background:#fff;color:var(--red);font-weight:900;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.slip .t{flex:1;font-weight:800;color:#fff}
.slip .t small{display:block;font-weight:600;opacity:.8;font-size:11px}
.slip .c{font-size:18px;font-weight:900;color:#fff}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;background:var(--bg);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;z-index:31;transform:translateY(100%);transition:transform .25s ease;display:flex;flex-direction:column}
.sheet.show{transform:none}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.sheet-h b{flex:1;font-size:15.5px;font-weight:800}
.sheet-c{overflow-y:auto;padding:14px 16px 28px}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line2);margin:8px auto 0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{color:var(--mu);font-weight:600;text-align:right;padding:6px 4px;font-size:11px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
tr.best td{color:var(--grn);font-weight:700}
.hs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.hs>.card{flex:0 0 78%;margin:0!important}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px}
.stat3 span{display:block;color:var(--mu);font-size:10.5px;font-weight:600}
.stat3 b{font-size:17px;font-weight:800}
.form{display:flex;gap:4px}
.form button{width:30px;height:30px;border-radius:7px;background:var(--s2);border:1px solid var(--line);font-weight:800;font-size:12px;color:var(--mu)}
.form button.V{background:var(--grnbg);border-color:rgba(31,194,122,.4);color:var(--grn)}
.form button.N{background:var(--s3);color:var(--tx)}
.form button.D{background:var(--redbg);border-color:rgba(227,24,45,.4);color:#FF5A6A}
.score-g{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.score-g div{background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:7px 2px;text-align:center}
.score-g b{display:block;font-size:14px}
.score-g span{font-size:10.5px;color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:40px 20px}
.empty svg{width:40px;height:40px;color:var(--mu2);margin-bottom:10px}
.tool{display:flex;align-items:center;gap:12px;padding:14px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;width:100%;text-align:left}
.tool .ic{width:40px;height:40px;border-radius:10px;background:var(--redbg);color:var(--red);display:grid;place-items:center;flex-shrink:0}
.tool .ic svg{width:20px;height:20px}
.tool b{display:block;font-size:14px}.tool span{color:var(--mu);font-size:12px}
.res{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:6px}
.res .row{padding:4px 0}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-20px);background:var(--s3);border:1px solid var(--line2);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:50;opacity:0;transition:all .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1;transform:translate(-50%,0)}
.spin{width:22px;height:22px;border:3px solid var(--line2);border-top-color:var(--red);border-radius:50%;animation:sp 0.8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.legal{color:var(--mu2);font-size:11px;text-align:center;margin-top:22px;line-height:1.5}
.sw{position:relative;width:42px;height:24px;flex-shrink:0}
.sw input{opacity:0;position:absolute;inset:0;z-index:1}
.sw i{position:absolute;inset:0;background:var(--s3);border-radius:12px;transition:.2s}
.sw i::after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+i{background:var(--red)}
.sw input:checked+i::after{left:21px}
.line-r{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);gap:10px}
.line-r:last-child{border-bottom:0}
.spark{width:100%;height:70px;display:block}
.hist{padding:11px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.gold{position:relative;border-radius:16px;padding:1.5px;background:linear-gradient(135deg,#F7DE8B,#C9962B 35%,#F3D27A 60%,#A87A1E);box-shadow:0 0 26px rgba(214,170,60,.22);margin-bottom:6px}
.gold>.in{background:linear-gradient(180deg,#1A1710,var(--s1) 55%);border-radius:14.5px;padding:14px}
.gold-t{display:flex;align-items:center;gap:8px;color:#E9C766;font-weight:800;font-size:12px;letter-spacing:.14em;margin-bottom:12px}
.gold-t svg{width:16px;height:16px}
.gold .lbl{color:#C9A54A;font-size:10.5px;font-weight:800;letter-spacing:.1em;margin:4px 0 6px}
.gold .big{display:flex;align-items:center;gap:12px}
.gold .big .m{flex:1;min-width:0}
.gold .big b.nm{display:block;font-size:15px;font-weight:800}
.gold .big span{display:block;color:var(--mu);font-size:12px}
.gold .od{font-size:22px;font-weight:900;color:#F3D27A}
.gold .why{font-size:12.5px;color:#CFC6AE;line-height:1.5;margin:8px 0 10px;padding:9px 11px;background:rgba(214,170,60,.08);border-radius:9px;border:1px solid rgba(214,170,60,.18)}
.gold .sep{height:1px;background:rgba(214,170,60,.22);margin:14px 0}
.btn.gb{background:linear-gradient(135deg,#F3D27A,#C9962B);color:#1A1406}
.combo.gc{border:1.5px solid #D4AF37;box-shadow:0 0 22px rgba(214,170,60,.18)}
.combo.gc .combo-h{background:linear-gradient(90deg,rgba(214,170,60,.18),var(--s2))}
.combo.gc .rk{color:#E9C766}
.hb{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);color:var(--mu);font-size:11px;font-weight:800;margin-left:6px;vertical-align:middle;letter-spacing:0;text-transform:none;flex-shrink:0}
.pop{position:fixed;left:16px;right:16px;top:50%;transform:translate(0,-50%) scale(.96);background:var(--s1);border:1px solid var(--line2);border-radius:16px;padding:18px;z-index:41;opacity:0;pointer-events:none;transition:.18s;max-height:80%;overflow:auto}
.pop.show{opacity:1;pointer-events:auto;transform:translate(0,-50%) scale(1)}
.pop h3{font-size:16px;margin-bottom:8px}
.pop p{color:#C9CFDB;font-size:13.5px;line-height:1.55;margin-bottom:8px}
.pov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
.pov.show{display:block}
.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;display:grid;place-items:center;flex-shrink:0;font-size:13px}
.step b{display:block;margin-bottom:2px}
.step span{color:var(--mu);font-size:12.5px;line-height:1.5}
.gl{padding:10px 0;border-bottom:1px solid var(--line)}
.gl:last-child{border-bottom:0}
.gl b{display:block;margin-bottom:2px}
.gl span{color:var(--mu);font-size:12.5px;line-height:1.5}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--red)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#E3182D"/><path d="M19 47V17h15.5c7 0 11.5 4.3 11.5 10.6S41.5 38.2 34.5 38.2H27V47z" fill="none" stroke="#fff" stroke-width="5.5" stroke-linejoin="round"/><path d="M27 31.4h7c2.6 0 4.2-1.5 4.2-3.8s-1.6-3.8-4.2-3.8h-7z" fill="#E3182D"/><circle cx="45.5" cy="45.5" r="4" fill="#fff"/></svg>
      <b>PARI<span>METRIC</span></b>
    </div>
    <div class="chip-bank num" id="bankChip"><i></i><span id="bankVal">0 €</span></div>
    <button class="ibtn" id="btnHelp" aria-label="Guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 1c0 1.8-2.5 2.2-2.5 3.7M12 17.2h.01"/></svg></button>
    <button class="ibtn" id="btnSettings" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </header>
  <div class="sports" id="sports"></div>
  <main id="main"></main>
</div>
<div class="slip" id="slip"><div class="cnt" id="slipN">0</div><div class="t">Coupon<small id="slipP">Probabilité</small></div><div class="c num" id="slipC">1.00</div></div>
<nav id="nav"></nav>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="sheet-h"><b id="sheetT"></b><button class="ibtn" id="sheetX" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="sheet-c" id="sheetC"></div></div>
<div class="toast" id="toast"></div>
<div class="pov" id="pov"></div><div class="pop" id="pop"></div>

<script>
'use strict';
/* ============================== Utilitaires ============================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const f2 = (x) => (isFinite(x) ? x.toFixed(2) : '-');
const pct = (x, d = 1) => (isFinite(x) ? (x * 100).toFixed(d) + ' %' : '-');
const sgn = (x, d = 1) => (isFinite(x) ? (x >= 0 ? '+' : '') + (x * 100).toFixed(d) + ' %' : '-');
const eur = (x) => (isFinite(x) ? x.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €' : '-');
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const store = {
  get(k, d) { try { const v = localStorage.getItem('pm.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pm.' + k, JSON.stringify(v)); } catch (e) {} },
};
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200); }
const ICON = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  combo: '<path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/>',
  tools: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/>',
  track: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/>',
  check: '<path d="M5 12l5 5L20 7"/>',

function selections(evs) {

  for (const ev of evs) {
    if (new Date(ev.time) < Date.now() - 5 * 6e4) continue;
    const A = analyse(ev);
    for (const mk of ['h2h', 'totals']) {
      const M = A[mk]; if (!M || M.books < Math.min(S.minBooks, Object.keys(ev.books).length)) continue;
      for (const o of M.out) out.push({ id: `${ev.id}|${mk}|${o.k}`, ev, market: mk, k: o.k, line: M.line, p: o.p, odds: o.best, book: o.bestBk, fair: o.fairOdds, evv: o.ev, conf: conf(o, M.books), name: label(ev, mk, o.k, M.line), est: false });
    }
    if (A.h2h && ev.draw) {
      const g = Object.fromEntries(A.h2h.out.map((o) => [o.k, o]));
      const mg = A.h2h.margin;
      for (const [k, a, b] of [['1X', 'home', 'draw'], ['X2', 'draw', 'away'], ['12', 'home', 'away']]) {
        const p = g[a].p + g[b].p; const odds = Math.max(1.01, +(1 / (p * (1 + mg * 0.8))).toFixed(2));
        out.push({ id: `${ev.id}|dc|${k}`, ev, market: 'dc', k, p, odds, book: 'cote estimée', fair: 1 / p, evv: p * odds - 1, conf: Math.round(clamp(p * 70 + 18 * clamp(1 - (g[a].sd + g[b].sd) / 0.06, 0, 1) + 12 * clamp(A.h2h.books / 6, 0, 1), 0, 100)), name: label(ev, 'dc', k), est: true });
      }
    }
  }
  return out;
}
function kelly(p, o) { const b = o - 1; return b > 0 ? Math.max(0, (b * p - (1 - p)) / b) : 0; }
function stakeFor(p, o) { return Math.min(S.bankroll * S.maxStakePct, S.bankroll * kelly(p, o) * S.kellyFrac); }

// Générateur de combinés : énumère les combinaisons (une sélection max par match), filtre la cote cible,
// classe selon le mode. Probabilité jointe = produit (matchs indépendants).
function buildCombos(cfg) {
  let sel = selections(visibleEvents()).filter((s) => s.p >= cfg.minP && s.odds > 1.03 && (cfg.h2h || s.market !== 'h2h') && (cfg.totals || s.market !== 'totals') && (cfg.dc || s.market !== 'dc'));
  const score = (s) => (cfg.mode === 'value' ? s.evv + s.p * 0.05 : cfg.mode === 'bal' ? Math.log(s.odds) * s.p + s.evv : s.p + s.conf / 1000);
  const byEv = {}; for (const s of sel) (byEv[s.ev.id] = byEv[s.ev.id] || []).push(s);
  sel = Object.values(byEv).flatMap((a) => a.sort((x, y) => score(y) - score(x)).slice(0, 2)).sort((x, y) => score(y) - score(x)).slice(0, cfg.legs >= 5 ? 30 : 46);
  const K = cfg.legs; const res = []; const cur = [];
  let guard = 0;
  (function rec(start, P, O) {
    if (++guard > 1500000) return;
    if (cur.length === K) {
      if (O >= cfg.minOdds && O <= cfg.maxOdds) res.push({ legs: cur.slice(), P, O, EV: P * O - 1 });
      return;
    }
    for (let i = start; i < sel.length; i++) {
      const s = sel[i]; if (cur.some((c) => c.ev.id === s.ev.id)) continue;
      if (O * s.odds > cfg.maxOdds * 1.0001) continue; // toute cote > 1 : on ne redescendra pas sous le max
      cur.push(s); rec(i + 1, P * s.p, O * s.odds); cur.pop();
    }
  })(0, 1, 1);
  const rank = cfg.mode === 'value' ? (c) => c.EV : cfg.mode === 'bal' ? (c) => c.P * Math.log(c.O) + c.EV * 0.5 : (c) => c.P;
  res.sort((a, b) => rank(b) - rank(a));
  const out = []; const used = {};
  for (const c of res) { const key = c.legs.map((l) => l.id).join(); const overlap = c.legs.filter((l) => used[l.id] >= 2).length; if (overlap >= Math.ceil(K / 2) && out.length > 4) continue; c.legs.forEach((l) => (used[l.id] = (used[l.id] || 0) + 1)); out.push(c); if (out.length >= 15) break; }
  return { combos: out, pool: sel.length };
}
function visibleEvents() { return state.events.filter((e) => (state.sport === 'all' || groupOf(e.sport) === state.sport) && (state.comp === 'all' || e.sport === state.comp) && new Date(e.time) > Date.now() - 3 * 36e5); }

/* Modèle statistique pré-match (Poisson) : attaque/défense + forme récente */
function formScore(f) { return (f || []).reduce((a, r, i) => a + (r === 'V' ? 3 : r === 'N' ? 1 : r === 'D' ? 0 : 1.4) * (1 + (4 - i) * 0.1), 0) / (5 * 1.2 * 3); }
function modelProbs(m) {
  if (m.type === 'rank') { // sports à 2 issues : écart de classement, % de victoires sur 12 mois, forme récente
    const x = 0.75 * Math.log(Math.max(1, m.rb) / Math.max(1, m.ra)) + 2.5 * ((m.wa - m.wb) / 100) + 1.2 * (formScore(m.fh) - formScore(m.fa));
    const p = 1 / (1 + Math.exp(-x)); return { type: 'rank', home: p, away: 1 - p };
  }
  const lgH = 1.5, lgA = 1.2;
  const fh = formScore(m.fh), fa = formScore(m.fa);
  const lh = clamp((m.hs / lgH) * (m.ac / lgH) * lgH * (1 + (fh - fa) * 0.25), 0.2, 4.5);
  const la = clamp((m.as / lgA) * (m.hc / lgA) * lgA * (1 + (fa - fh) * 0.25), 0.15, 4);
  if (!isFinite(lh) || !isFinite(la)) return null;
  const P = poissonProbs(lh, la); P.lh = lh; P.la = la; return P;
}

function vTrack() {

  const mn = Math.min(...pts), mx = Math.max(...pts, mn + 1);

  return `<div class="kpis"><div class="kpi"><span>Bénéfice</span><b class="num" style="color:${ret - staked >= 0 ? 'var(--grn)' : '#FF5A6A'}">${eur(ret - staked)}</b></div><div class="kpi"><span>ROI</span><b class="num">${staked ? sgn((ret - staked) / staked) : '-'}</b></div><div class="kpi"><span>Réussite</span><b class="num">${done.length ? pct(won / done.length, 0) : '-'}</b></div></div>

function openMatch(id) {
  const ev = state.events.find((e) => e.id === id); if (!ev) return;
  openSheet(ev.home + ' - ' + ev.away, vMatchSheet(ev));

  if (!draft.type) draft.type = 'poisson';
  const refresh = () => {
    const top = C.scrollTop;
    if (state.models[ev.id]) { state.models[ev.id] = draft; store.set('models', state.models); }
    C.innerHTML = vMatchSheet(ev, draft); C.scrollTop = top;
  };
  C.onclick = (e) => {
    const s = e.target.closest('[data-sel]'); if (s) { const x = selections([ev]).find((q) => q.id === s.dataset.sel); if (x) toggleSel(x); C.querySelectorAll('[data-sel]').forEach((b) => b.classList.toggle('sel', inSlip(b.dataset.sel))); return; }

  const H = {
    arb: ['Calculateur de surebet', `<div class="grid3"><div class="fld"><label>Cote 1</label><input type="number" step="0.01" class="ai" value="2.10"></div><div class="fld"><label>Cote N (option.)</label><input type="number" step="0.01" class="ai" value=""></div><div class="fld"><label>Cote 2</label><input type="number" step="0.01" class="ai" value="2.05"></div></div><div class="fld"><label>Mise totale (€)</label><input type="number" id="aT" value="100"></div><div class="res" id="out"></div>`],
    kelly: ['Critère de Kelly', `<div class="grid2"><div class="fld"><label>Cote</label><input type="number" step="0.01" id="kO" value="2.20"></div><div class="fld"><label>Votre probabilité (%)</label><input type="number" id="kP" value="50"></div></div><div class="grid2"><div class="fld"><label>Bankroll (€)</label><input type="number" id="kB" value="${S.bankroll}"></div><div class="fld"><label>Fraction de Kelly</label><select id="kF"><option value="1">Kelly complet</option><option value="0.5">1/2 Kelly</option><option value="0.25" selected>1/4 Kelly</option><option value="0.1">1/10 Kelly</option></select></div></div><div class="res" id="out"></div>`],
    conv: ['Convertisseur de cotes', `<div class="fld"><label>Cote décimale</label><input type="number" step="0.01" id="cvD" value="1.80"></div><div class="res" id="out"></div>`],
    sys: ['Paris système', `<div class="fld"><label>Cotes des sélections (séparées par des espaces)</label><input id="sO" value="1.6 1.8 2.1 1.5"></div><div class="grid2"><div class="fld"><label>Système : combinés de</label><input type="number" id="sK" value="2" min="1"></div><div class="fld"><label>Mise par combinaison (€)</label><input type="number" id="sM" value="1"></div></div><div class="fld"><label>Probabilités estimées en % (option.)</label><input id="sP" placeholder="ex. 60 55 45 65"></div><div class="res" id="out"></div>`],
    margin: ['Marge du bookmaker', `<div class="grid3"><div class="fld"><label>Cote 1</label><input type="number" step="0.01" class="mi" value="1.85"></div><div class="fld"><label>Cote N</label><input type="number" step="0.01" class="mi" value="3.60"></div><div class="fld"><label>Cote 2</label><input type="number" step="0.01" class="mi" value="4.20"></div></div><div class="res" id="out"></div>`],
  }[k];
  openSheet(H[0], H[1]);
  const C = $('#sheetC'); const out = () => $('#out'); const r = (a, b, st) => `<div class="row sp-b"><span class="muted">${a}</span><b class="num" ${st ? `style="${st}"` : ''}>${b}</b></div>`;
  const calc = {
    arb() { const o = [...C.querySelectorAll('.ai')].map((i) => +i.value).filter((x) => x > 1); const T = +$('#aT').value || 0; const inv = o.reduce((a, x) => a + 1 / x, 0); const ok = inv < 1;
      out().innerHTML = r('Somme des probabilités', pct(inv)) + r(ok ? 'Profit garanti' : 'Pas d’arbitrage', ok ? sgn(1 / inv - 1, 2) : sgn(1 / inv - 1, 2), `color:${ok ? 'var(--grn)' : '#FF5A6A'}`) + o.map((x, i) => r('Mise sur cote ' + f2(x), eur(T / x / inv))).join('') + r('Retour quelle que soit l’issue', eur(T / inv)); },
    kelly() { const o = +$('#kO').value, p = +$('#kP').value / 100, B = +$('#kB').value, F = +$('#kF').value; const k = kelly(p, o);
      out().innerHTML = r('Espérance', sgn(p * o - 1), `color:${p * o > 1 ? 'var(--grn)' : '#FF5A6A'}`) + r('Kelly complet', pct(k)) + r('Mise conseillée', eur(B * k * F)) + r('Probabilité implicite de la cote', pct(1 / o)); },
    conv() { const d = +$('#cvD').value; if (!(d > 1)) return; const fr = (() => { const x = d - 1; let best = [1, 1], e = 9; for (let q = 1; q <= 20; q++) { const p = Math.round(x * q); const er = Math.abs(p / q - x); if (er < e - 1e-9) { e = er; best = [p, q]; } } return best.join('/'); })();
      out().innerHTML = r('Probabilité implicite', pct(1 / d, 2)) + r('Fractionnelle', fr) + r('Américaine', d >= 2 ? '+' + Math.round((d - 1) * 100) : String(Math.round(-100 / (d - 1)))) + r('Gain net pour 10 €', eur(10 * (d - 1))); },
    sys() { const o = $('#sO').value.split(/[\s,;]+/).map(Number).filter((x) => x > 1); const K = Math.min(+$('#sK').value || 1, o.length); const M = +$('#sM').value || 0; const ps = $('#sP').value.split(/[\s,;]+/).map((x) => +x / 100).filter((x) => x > 0 && x < 1);
      const combs = []; (function c(s, a) { if (a.length === K) return combs.push(a.slice()); for (let i = s; i < o.length; i++) { a.push(i); c(i + 1, a); a.pop(); } })(0, []);
      const P = ps.length === o.length ? ps : o.map((x) => 1 / x / 1.05);
      let ev = 0; for (let mask = 0; mask < 1 << o.length; mask++) { let pr = 1; for (let i = 0; i < o.length; i++) pr *= mask & (1 << i) ? P[i] : 1 - P[i]; let ret = 0; for (const cb of combs) if (cb.every((i) => mask & (1 << i))) ret += M * cb.reduce((a, i) => a * o[i], 1); ev += pr * ret; }
      const cost = combs.length * M; const maxW = combs.reduce((a, cb) => a + M * cb.reduce((x, i) => x * o[i], 1), 0);
      const minWin = Math.min(...combs.map((cb) => M * cb.reduce((x, i) => x * o[i], 1)));
      out().innerHTML = r('Combinaisons', combs.length) + r('Coût total', eur(cost)) + r('Gain si tout passe', eur(maxW)) + r(`Gain minimum avec ${K} bonnes`, eur(minWin)) + r('Retour moyen attendu', eur(ev)) + r('Espérance', sgn(cost ? ev / cost - 1 : 0), `color:${ev >= cost ? 'var(--grn)' : '#FF5A6A'}`); },
    margin() { const o = [...C.querySelectorAll('.mi')].map((i) => +i.value).filter((x) => x > 1); const f = devig(o); const mg = o.reduce((a, x) => a + 1 / x, 0) - 1;
      out().innerHTML = r('Marge', pct(mg, 2)) + o.map((x, i) => r(`Cote ${f2(x)} : proba juste`, pct(f[i]) + ' · cote juste ' + f2(1 / f[i]))).join(''); },
  }[k];
  C.oninput = calc; calc();
}

function openSettings() {
  openSheet('Réglages', `
    <h2 style="margin-top:0">Source des cotes</h2>
    <div class="card"><div class="fld"><label>Clé API The Odds API (gratuite sur the-odds-api.com, 500 requêtes / mois)</label><input id="sKey" value="${esc(S.apiKey)}" placeholder="Collez votre clé" autocomplete="off"></div>
    <div class="fld"><label>Marchés chargés</label><select id="sMk"><option value="h2h,totals" ${S.markets === 'h2h,totals' ? 'selected' : ''}>Résultat + plus/moins (2 crédits par compétition)</option><option value="h2h" ${S.markets === 'h2h' ? 'selected' : ''}>Résultat seulement (1 crédit par compétition)</option></select></div>
    <div class="fld" style="margin-bottom:0"><label>Région des bookmakers</label><select id="sReg">${[['eu', 'Europe'], ['uk', 'Royaume-Uni'], ['fr', 'France'], ['us', 'États-Unis'], ['au', 'Australie']].map(([v, l]) => `<option value="${v}" ${S.region === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>
    <h2>Gestion de la bankroll</h2>
    <div class="card"><div class="grid2"><div class="fld"><label>Bankroll (€)</label><input type="number" id="sBank" value="${S.bankroll}"></div><div class="fld"><label>Mise max. (% bankroll)</label><input type="number" id="sMax" value="${S.maxStakePct * 100}"></div></div>
    <div class="fld" style="margin-bottom:0"><label>Fraction de Kelly</label><select id="sKelly">${[[1, 'Kelly complet'], [0.5, '1/2 Kelly'], [0.25, '1/4 Kelly (conseillé)'], [0.1, '1/10 Kelly']].map(([v, l]) => `<option value="${v}" ${S.kellyFrac == v ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>
    <h2>Moteur d’analyse</h2>
    <div class="card"><div class="grid2"><div class="fld"><label>Bookmakers minimum</label><input type="number" id="sMin" value="${S.minBooks}"></div><div class="fld"><label>Poids books « sharp »</label><input type="number" id="sSharp" value="${S.sharpWeight}"></div></div></div>
    <button class="btn" id="sSave" style="margin-top:16px">Enregistrer et actualiser</button>
    <button class="btn sec" id="sGuide" style="margin-top:8px">Revoir le guide d’utilisation</button>
    <p class="legal">Parimetric v1.1 · Les clés et données restent sur votre téléphone.<br>Les jeux d’argent sont interdits aux mineurs. Jouer comporte des risques : endettement, dépendance. Appelez le 09 74 75 13 13 (appel non surtaxé).</p>`);
  $('#sSave').onclick = () => {
    const mk = $('#sMk').value, reg = $('#sReg').value; if (mk !== S.markets || reg !== S.region) state.cache = {};
    S = Object.assign(S, { apiKey: $('#sKey').value.trim(), region: reg, markets: mk, bankroll: +$('#sBank').value || 100, maxStakePct: (+$('#sMax').value || 5) / 100, kellyFrac: +$('#sKelly').value, minBooks: +$('#sMin').value || 1, sharpWeight: +$('#sSharp').value || 1 });
    store.set('settings', S); closeSheet(); loadOdds();
  };
  $('#sGuide').onclick = openGuide;
}

/* ============================== Navigation ============================== */
const TABS = [['home', 'Accueil', 'home'], ['matches', 'Matchs', 'list'], ['combos', 'Combinés', 'combo'], ['tools', 'Outils', 'tools'], ['track', 'Suivi', 'track']];
function go(t) { state.tab = t; $('#main').scrollTop = 0; render(); }
function render() {
  $('#nav').innerHTML = TABS.map(([k, l, i]) => `<button class="${state.tab === k ? 'on' : ''}" data-tab="${k}">${ic(i)}<span>${l}</span></button>`).join('');
  const present = new Set([...state.events.map((e) => groupOf(e.sport)), ...state.catalog.map((c) => c.group)]);
  const sp = [{ id: 'all', label: 'Tous' }, ...GROUPS.filter((g) => ['foot', 'tennis', 'basket', 'badminton'].includes(g.id) || present.has(g.id))];
  $('#sports').innerHTML = sp.map((g) => `<button class="sp ${state.sport === g.id ? 'on' : ''}" data-sport="${g.id}">${g.label}</button>`).join('');
  $('#sports').style.display = state.tab === 'tools' || state.tab === 'track' ? 'none' : '';
  $('#bankVal').textContent = eur(S.bankroll + state.bets.filter((b) => b.status !== 'open').reduce((a, b) => a + (b.status === 'won' ? b.stake * (b.odds - 1) : b.status === 'lost' ? -b.stake : 0), 0)).replace(',00', '');
  REG = {}; regN = 0;
  $('#main').innerHTML = { home: vHome, matches: vMatches, combos: vCombos, tools: vTools, track: vTrack }[state.tab]();
  updSlip();
}
document.addEventListener('click', (e) => {
  const hb = e.target.closest('[data-help]'); if (hb) { e.stopPropagation(); return showHelp(hb.dataset.help); }
  if (e.target.closest('#pop')) return;
  const t = e.target.closest('[data-tab]'); if (t) return go(t.dataset.tab);
  const sp = e.target.closest('[data-sport]'); if (sp) { state.sport = sp.dataset.sport; state.comp = 'all'; store.set('sport', state.sport); if (state.source === 'live') return loadOdds(); return render(); }
  if (e.target.closest('#sheet')) return;
  if (e.target.closest('#addMatch') || e.target.closest('#addMatch2')) return openAddMatch();
  if (e.target.closest('#loadAll')) return loadOdds({ all: true });
  const s = e.target.closest('[data-sel]'); if (s) { const x = selections(state.events).find((q) => q.id === s.dataset.sel); if (x) toggleSel(x); return; }
  const ev = e.target.closest('[data-ev]'); if (ev) return openMatch(ev.dataset.ev);
  const cb = e.target.closest('[data-combo]'); if (cb) { const c = REG[cb.dataset.combo]; if (c) { state.slip = []; c.legs.forEach(toggleSel); openSlip(); } return; }
  const md = e.target.closest('[data-mode]'); if (md) { state.combo.mode = md.dataset.mode; saveCombo(); return render(); }
  const lg = e.target.closest('[data-legs]'); if (lg) { state.combo.legs = +lg.dataset.legs; if (state.combo.legs >= 4 && state.combo.maxOdds < 8) state.combo.maxOdds = 12; saveCombo(); return render(); }
  const tl = e.target.closest('[data-tool]'); if (tl) return openTool(tl.dataset.tool);
  const st = e.target.closest('[data-st]'); if (st) { state.bets[+st.dataset.i].status = st.dataset.st; store.set('bets', state.bets); return render(); }
  const dl = e.target.closest('[data-del]'); if (dl) { state.bets.splice(+dl.dataset.del, 1); store.set('bets', state.bets); return render(); }
  if (e.target.closest('#reload')) return loadOdds({ force: true, all: false });
});
document.addEventListener('change', (e) => {
  if (e.target.closest('#sheet')) return;
  if (e.target.id === 'compSel') { state.comp = e.target.value; return render(); }
  const id = e.target.id; const c = state.combo;
  if (id === 'cMin') c.minOdds = +e.target.value || 1; else if (id === 'cMax') c.maxOdds = +e.target.value || 100; else if (id === 'cP') c.minP = +e.target.value; else if (id === 'cH') c.h2h = e.target.checked; else if (id === 'cD') c.dc = e.target.checked; else if (id === 'cT') c.totals = e.target.checked; else return;
  saveCombo(); render();
});
document.addEventListener('input', (e) => { if (e.target.id === 'cP') $('#pLbl').textContent = pct(+e.target.value, 0); });
function saveCombo() { store.set('comboCfg', state.combo); }
$('#slip').onclick = openSlip; $('#ov').onclick = closeSheet; $('#pov').onclick = hideHelp; $('#btnHelp').onclick = openGuide; $('#sheetX').onclick = closeSheet; $('#btnSettings').onclick = openSettings; $('#bankChip').onclick = () => go('track');

/* ============================== Démarrage ============================== */
(function boot() {
  refreshEvents();
  if (S.apiKey) {
    const c = store.get('catalog', null); if (c && c.key === S.apiKey) state.catalog = c.list;
    state.base = Object.values(state.cache).flatMap((x) => x.events); state.source = state.base.length ? 'live' : 'demo'; refreshEvents();
  }
  render();
  loadOdds();
  if (!store.get('seenGuide', 0)) openGuide();
})();
</script>
</body>
</html>
